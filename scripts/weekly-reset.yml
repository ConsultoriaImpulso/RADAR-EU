name: ♻️ Reset semanal — Domingo medianoche

on:
  schedule:
    - cron: '0 0 * * 0'   # Domingos a las 00:00 UTC
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resetear datos
        run: |
          FECHA=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"last_updated\":\"$FECHA\",\"last_reset\":\"$FECHA\",\"tenders\":[]}" > data.json

      - name: Commit y push
        run: |
          git config user.name  "Radar EU Bot"
          git config user.email "radar-eu-bot@noreply.github.com"
          git add data.json
          git commit -m "♻️ Reset semanal — $(date -u +'%d/%m/%Y')"
          git push
