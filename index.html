<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Radar EU · Licitaciones Europeas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇪🇺</text></svg>"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111;--bg2:#181818;--bg3:#1e1e1e;
  --bdr:rgba(255,255,255,.14);--bdr2:rgba(255,255,255,.08);
  --white:#f0ece4;
  /* Greys aclarados para mejor lectura sobre negro */
  --muted:#b8b3a8;       /* antes #888 — texto secundario */
  --muted2:#8a8478;      /* antes #555 — texto terciario */
  --gold:#d4a843;--green:#3dba7c;--r:8px;--r2:12px;
}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;font-size:14px;}

/* ── HEADER ─────────────────────────────────── */
.hdr{padding:2rem 2.5rem 1.5rem;max-width:1360px;margin:0 auto;}
.eu-badge{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--bdr);border-radius:20px;padding:4px 14px;font-size:11px;font-weight:600;letter-spacing:.08em;margin-bottom:1rem;color:var(--white);}
.eu-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hdr h1{font-size:1.85rem;font-weight:700;letter-spacing:-.025em;margin-bottom:.35rem;}
.hdr .sub{font-size:13px;color:var(--muted);margin-bottom:1.5rem;}

/* ── FILTER GROUP LABEL ─────────────────────── */
.filter-label{font-size:10.5px;font-weight:600;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:.55rem;}

/* ── PLATFORM PILLS (entidad) ────────────────── */
.platforms{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:1.4rem;}
.ptag{font-size:11px;padding:5px 13px;border:1px solid var(--bdr);border-radius:20px;color:var(--white);cursor:pointer;transition:all .15s;background:transparent;font-family:inherit;font-weight:500;}
.ptag:hover{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.06);}
.ptag.on{border-color:var(--white);background:rgba(255,255,255,.12);color:var(--white);}

/* ── SUB-PLATFORMS (desglose) ───────────────── */
.sub-platforms{margin:-0.6rem 0 1.4rem;padding:.85rem 1rem;background:rgba(255,255,255,.025);border:1px solid var(--bdr2);border-radius:var(--r);}
.sub-platforms .platforms{margin-bottom:0;}
.sub-label{margin-bottom:.45rem !important;color:var(--gold) !important;}
.ptag.sub{font-size:10.5px;padding:4px 11px;border-color:rgba(212,168,67,.35);}
.ptag.sub.on{border-color:var(--gold);background:rgba(212,168,67,.18);color:var(--gold);}

/* ── TYPE BUTTONS (Open Call / Licitación / Beca) ── */
.types{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:1.75rem;}
.tbtn{padding:9px 18px;border:1px solid var(--bdr);border-radius:var(--r);background:var(--bg2);color:var(--white);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;font-family:inherit;display:inline-flex;align-items:center;gap:7px;}
.tbtn:hover{border-color:rgba(255,255,255,.32);background:var(--bg3);}
.tbtn.on{background:var(--white);color:var(--bg);border-color:var(--white);}
.tbtn .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.55;}
.tbtn.on .dot{opacity:1;}

/* ── STATUS BAR ─────────────────────────────── */
.statusbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.6rem;padding:0 2.5rem .9rem;max-width:1360px;margin:0 auto;}
.status-l{display:flex;align-items:center;gap:.75rem;font-size:12px;color:var(--muted);flex-wrap:wrap;}
.udot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;}
.countdown{font-size:11px;color:var(--muted);}

/* ── REFRESH BUTTON ─────────────────────────── */
.btn-refresh{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;
  border:1px solid var(--bdr);
  border-radius:20px;
  background:transparent;
  color:var(--white);
  font-size:11px;font-weight:500;
  cursor:pointer;
  font-family:inherit;
  transition:all .15s;
  flex-shrink:0;
}
.btn-refresh:hover{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.08);}
.btn-refresh:disabled{opacity:.45;cursor:not-allowed;}
.btn-refresh .ico{display:inline-block;transition:transform .5s;}
.btn-refresh.spinning .ico{animation:spin-cont 1s linear infinite;}
@keyframes spin-cont{to{transform:rotate(360deg);}}

/* ── SEARCH BOX ─────────────────────────────── */
.status-r{display:flex;align-items:center;gap:8px;}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:6px 12px;}
.searchbox input{background:transparent;border:none;outline:none;color:var(--white);font-size:12px;font-family:inherit;width:200px;}
.searchbox input::placeholder{color:var(--muted2);}

/* ── RESULTS ────────────────────────────────── */
.results{max-width:1360px;margin:0 auto;padding:0 2.5rem 3rem;}
.counter{display:flex;align-items:baseline;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap;}
.counter .n{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;}
.counter .lbl{color:var(--muted);font-size:12px;}

/* ── TABLE ──────────────────────────────────── */
.tbl-wrap{overflow-x:auto;border:1px solid var(--bdr);border-radius:var(--r2);}
table{width:100%;border-collapse:collapse;}

thead tr{background:var(--bg2);border-bottom:1px solid var(--bdr);}
thead th{
  padding:11px 14px;font-size:10.5px;font-weight:600;
  letter-spacing:.07em;color:var(--muted);text-align:left;
  white-space:nowrap;user-select:none;
}

/* ── SORT HEADER ────────────────────────────── */
.th-sort{
  cursor:pointer;
  transition:color .15s;
  display:inline-flex;align-items:center;gap:5px;
}
.th-sort:hover{color:var(--white);}
.th-sort.asc  .arrow::after{content:'↑';}
.th-sort.desc .arrow::after{content:'↓';}
.th-sort .arrow{
  font-size:12px;color:var(--gold);
  opacity:.4;transition:opacity .15s;
}
.th-sort.asc  .arrow,
.th-sort.desc .arrow{opacity:1;}

tbody tr{border-bottom:1px solid var(--bdr2);transition:background .12s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:rgba(255,255,255,.03);}
tbody td{padding:13px 14px;vertical-align:top;font-size:12.5px;line-height:1.45;}

/* COL 1 — Convocatoria */
.td-title{font-weight:500;color:var(--white);margin-bottom:5px;line-height:1.4;}
.td-country{font-size:11.5px;color:var(--muted);margin-top:3px;}
.td-deadline{font-size:11.5px;color:var(--muted);margin-top:3px;}
.topic-tag{display:inline-block;font-size:9px;padding:1px 7px;border-radius:20px;font-weight:600;letter-spacing:.04em;margin-left:6px;vertical-align:middle;position:relative;top:-1px;background:#2a2a2a;color:#bdbdbd;}
/* Etiquetas de temática unificadas — todas en gris neutro.
   El color queda reservado para "Filtrar por tipo" (Open Call / Licitación / Beca). */
.b-mobility,.b-transport,.b-training,.b-infrastr,.b-smart,.b-green,.b-other{background:#2a2a2a;color:#bdbdbd;}

/* COL 2 — Fecha */
.td-date{color:var(--white);font-size:12px;white-space:nowrap;}

/* COL 3 — Entidad + tipo */
.td-entity{color:var(--white);font-size:12px;margin-bottom:5px;}
.td-subplatform{color:var(--gold);font-size:10.5px;margin-bottom:5px;letter-spacing:.02em;}
.type-pill{display:inline-block;font-size:10px;padding:2px 9px;border-radius:20px;font-weight:600;letter-spacing:.03em;}
.tp-opencall{background:#0e3d28;color:#52d68a;}
.tp-licitacion{background:#0d2e4a;color:#5aaff0;}
.tp-concurso{background:#3d2a0a;color:#e0a84a;}
.tp-beca{background:#2a1a3d;color:#c084fc;}
.tp-formacion{background:#3d2a0a;color:#e0a84a;}
.tp-other{background:#2a2a2a;color:#bdbdbd;}

/* COL 4 — Valor */
.td-budget{color:var(--gold);font-size:12px;font-weight:500;}
.td-budget.empty{color:var(--muted);}

/* COL 5 — Link */
.td-link{text-align:center;}
.link-btn{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--gold);text-decoration:none;padding:5px 12px;border:1px solid rgba(212,168,67,.4);border-radius:20px;transition:all .15s;white-space:nowrap;}
.link-btn:hover{background:rgba(212,168,67,.12);border-color:rgba(212,168,67,.7);}

/* ── EMPTY ──────────────────────────────────── */
.empty{padding:4rem 2rem;text-align:center;color:var(--muted);border:1px dashed var(--bdr);border-radius:var(--r2);}
.empty-icon{font-size:2rem;margin-bottom:.75rem;opacity:.5;}
.empty h3{font-size:.95rem;color:var(--white);margin-bottom:.35rem;}
.empty p{font-size:12px;color:var(--muted);}

/* ── LOADING TOAST ──────────────────────────── */
.loader{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:9px 15px;display:flex;align-items:center;gap:9px;font-size:12px;color:var(--white);box-shadow:0 4px 20px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;}
.loader.show{opacity:1;}
.spin{width:12px;height:12px;border:1.5px solid var(--bdr);border-top-color:var(--green);border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:700px){
  .hdr,.statusbar,.results{padding-left:1rem;padding-right:1rem;}
  .hdr h1{font-size:1.3rem;}
  thead th:nth-child(2),thead th:nth-child(4),
  tbody td:nth-child(2),tbody td:nth-child(4){display:none;}
  .searchbox input{width:130px;}
}
</style>
</head>
<body>

<!-- ══ HEADER ══════════════════════════════════ -->
<div class="hdr">
  <div class="eu-badge"><span class="eu-dot"></span>SISTEMA DE ALERTAS UE</div>
  <h1>Radar de Licitaciones Europeas</h1>
  <p class="sub">Licitaciones · Convocatorias abiertas · Concursos para proyectos</p>

  <!-- Filtro 1: por entidad/plataforma -->
  <div class="filter-label">Filtrar por entidad</div>
  <div class="platforms" id="platforms">
    <button class="ptag on" data-p="all">Todas las entidades</button>
    <button class="ptag" data-p="Tenders Electronic Daily (TED · DOUE Serie S)">TED · DOUE Serie S</button>
    <button class="ptag" data-p="Portal de Financiación y Licitaciones de la UE (F&T Portal · SEDIA)">F&amp;T Portal (SEDIA)</button>
    <button class="ptag" data-p="Instituto Europeo de Innovación y Tecnología – Movilidad Urbana (EIT Urban Mobility)">EIT Urban Mobility</button>
    <button class="ptag" data-p="Banco de Desarrollo de América Latina y el Caribe (CAF)">CAF · Banco LATAM</button>
  </div>

  <!-- Sub-filtro por sub-plataforma (se muestra al seleccionar una entidad) -->
  <div class="sub-platforms" id="subPlatforms" style="display:none">
    <div class="filter-label sub-label">Sub-programa</div>
    <div class="platforms" id="subPlatformsList"></div>
  </div>

  <!-- Filtro 2: por tipo de convocatoria -->
  <div class="filter-label">Filtrar por tipo</div>
  <div class="types" id="types">
    <button class="tbtn on" data-c="all">Todas</button>
    <button class="tbtn" data-c="opencall"><span class="dot" style="background:#52d68a"></span>Convocatorias abiertas</button>
    <button class="tbtn" data-c="licitacion"><span class="dot" style="background:#5aaff0"></span>Licitaciones</button>
    <button class="tbtn" data-c="beca"><span class="dot" style="background:#c084fc"></span>Becas y formación</button>
  </div>
</div>

<!-- ══ STATUS BAR ═══════════════════════════════ -->
<div class="statusbar">
  <div class="status-l">
    <span class="udot"></span>
    <span id="lastUpdate">Cargando…</span>
    <span class="countdown" id="countdown"></span>
    <button class="btn-refresh" id="btnRefresh" title="Recargar datos">
      <span class="ico">↻</span> Actualizar
    </button>
  </div>
  <div class="status-r">
    <div class="searchbox">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8a8478" stroke-width="2.5">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Buscar convocatoria…"/>
    </div>
  </div>
</div>

<!-- ══ RESULTS ══════════════════════════════════ -->
<div class="results">
  <div class="counter">
    <span class="n" id="countNum">—</span>
    <span class="lbl">convocatorias esta semana</span>
  </div>
  <div id="tableWrap"></div>
</div>

<div class="loader" id="loader"><div class="spin"></div>Actualizando…</div>

<script>
/* ─── CONFIG ──────────────────────────────────── */
const DATA_URL    = './data.json';
const REFRESH_MS  = 60000;          // Auto-recarga del JSON cada minuto

/* ─── MAPS ────────────────────────────────────── */
const BADGE  = {mobility:'b-mobility',transport:'b-transport',training:'b-training',infrastr:'b-infrastr',smart:'b-smart',green:'b-green',other:'b-other'};
const BLABEL = {mobility:'MOVILIDAD',transport:'TRANSPORTE',training:'FORMACIÓN',infrastr:'INFRAESTRUCTURA',smart:'CIUDAD INTELIGENTE',green:'SOSTENIBILIDAD',other:'OTRA'};

/* ─── STATE ───────────────────────────────────── */
let allTenders        = [];
let activeType        = 'all';   // all | opencall | licitacion | beca
let activePlatform    = 'all';
let activeSubPlatform = 'all';   // sub-programa dentro de una plataforma
let sortDir           = 'desc';

/* ─── DETECT CALL TYPE ──────────────────────────
   Devuelve {l: label visible, c: clase css, k: key para filtrar}
   k ∈ {'opencall', 'licitacion', 'beca', 'other'}
   Si t.type viene marcado por el scraper, lo respetamos;
   si no, hacemos detección por keywords como fallback.       */
function callType(t) {
  // Tipo explícito desde el scraper (más fiable)
  if (t.type === 'beca')       return {l:'Beca / Fellowship', c:'tp-beca',       k:'beca'};
  if (t.type === 'opencall')   return {l:'Open Call',         c:'tp-opencall',   k:'opencall'};
  if (t.type === 'licitacion') return {l:'Licitación',        c:'tp-licitacion', k:'licitacion'};

  // Fallback: detectar por contenido
  const s = (t.title+' '+(t.description||'')+' '+(t.platform||'')).toLowerCase();
  if (/master school|fellowship|beca|scholarship/i.test(s))  return {l:'Beca / Fellowship', c:'tp-beca',       k:'beca'};
  if (/open call|call for proposal/i.test(s))                return {l:'Open Call',         c:'tp-opencall',   k:'opencall'};
  if (/formación|training|master|curso|education/i.test(s))  return {l:'Formación',         c:'tp-formacion',  k:'beca'};
  if (/suministro|supply|provisión|provision|bus |tren|rolling|procurement/i.test(s)) return {l:'Licitación', c:'tp-licitacion', k:'licitacion'};
  if (/concurso|competition|prize/i.test(s))                 return {l:'Concurso',          c:'tp-concurso',   k:'licitacion'};
  if (/horizon|msca|life |cinea|eacea|eit|cef|accelerat/i.test(s)) return {l:'Open Call',   c:'tp-opencall',   k:'opencall'};
  return {l:'Convocatoria', c:'tp-other', k:'other'};
}

/* ─── DETECT COUNTRY ──────────────────────────── */
function country(t) {
  const s = (t.title+' '+(t.description||'')).toLowerCase();
  const map=[
    [/czech|cheq|praga|ostrava|slezsko/,'🇨🇿 Chequia'],
    [/norueg|norway|kristiansand/,'🇳🇴 Noruega'],
    [/poland|polonia|krak[oó]w|polsk|miejsk/,'🇵🇱 Polonia'],
    [/portugal/,'🇵🇹 Portugal'],
    [/spain|españa|andaluc|madrid|barcelona|aopja/,'🇪🇸 España'],
    [/france|francia|saint.etienne|pl[eé]lan/,'🇫🇷 Francia'],
    [/german|alemania/,'🇩🇪 Alemania'],
    [/ital|alto adige|sta /,'🇮🇹 Italia'],
    [/estonia|eesti/,'🇪🇪 Estonia'],
    [/latvia|letonia/,'🇱🇻 Letonia'],
    [/croati|croacia/,'🇭🇷 Croacia'],
  ];
  for (const [re,label] of map) if (re.test(s)) return label;
  return '🇪🇺 UE';
}

function fmtDate(d) {
  if (!d) return '—';
  try { return new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'2-digit'}); }
  catch { return d; }
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ─── DATE COMPARISON ─────────────────────────── */
function dateVal(d) {
  // Returns a comparable value; tenders without date get placed last
  if (!d) return sortDir === 'desc' ? '0000-00-00' : '9999-99-99';
  return d;
}

/* ─── LOAD ──────────────────────────────────────
   manual = true cuando el usuario pulsa el botón.
   En ese caso, además de recargar el JSON, registramos la hora local
   real en localStorage para mostrarla como "última actualización"
   percibida por quien consulta.                                  */
async function loadData(manual = false) {
  const btn = document.getElementById('btnRefresh');
  document.getElementById('loader').classList.add('show');
  if (manual) {
    btn.disabled = true;
    btn.classList.add('spinning');
  }

  try {
    const r = await fetch(DATA_URL + '?t=' + Date.now());
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();

    // Filtramos las convocatorias cuyo deadline (cierre) ya ha pasado.
    // Las que no tienen deadline (ej. algunas licitaciones TED) se mantienen.
    const today = new Date().toISOString().slice(0, 10);   // 'YYYY-MM-DD'
    allTenders = (d.tenders || []).filter(t => {
      if (!t.deadline) return true;          // sin cierre → seguir mostrando
      return t.deadline >= today;            // cierre hoy o futuro → mostrar
    });

    // Hora a mostrar:
    // - Si fue una actualización manual → la hora local de AHORA
    //   (porque la persona acaba de pulsar el botón y se ha
    //   refrescado la web con los datos del JSON ahora mismo)
    // - Si fue carga automática → la hora del último fetch del bot
    if (manual) {
      const nowIso = new Date().toISOString();
      try { localStorage.setItem('radareu_last_refresh', nowIso); } catch(_) {}
      setUpdated(nowIso, true);
    } else {
      // En carga automática usamos la última manual del usuario
      // si existe, sino la del bot (last_updated del JSON)
      let stored = null;
      try { stored = localStorage.getItem('radareu_last_refresh'); } catch(_) {}
      if (stored) setUpdated(stored, true);
      else        setUpdated(d.last_updated, false);
    }

    rebuildSubPlatforms();
    render();

    if (manual) {
      // Brief green flash on the dot
      const dot = document.querySelector('.udot');
      dot.style.background = '#3dba7c';
      dot.style.boxShadow  = '0 0 8px #3dba7c';
      setTimeout(() => { dot.style.background=''; dot.style.boxShadow=''; }, 1000);
    }
  } catch(e) {
    document.getElementById('lastUpdate').textContent = '⚠ Error al cargar datos';
    showEmpty('No se pudieron cargar los datos.', 'Comprueba que data.json existe en el repositorio.');
  } finally {
    document.getElementById('loader').classList.remove('show');
    btn.disabled = false;
    btn.classList.remove('spinning');
  }
}

/* ─── RENDER ──────────────────────────────────── */
function render() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();

  let rows = allTenders.filter(t => {
    const ct = callType(t);
    const okType = activeType === 'all' || (t.type ? t.type === activeType : ct.k === activeType);
    const okP    = activePlatform === 'all' || (t.platform||'') === activePlatform;
    const okSub  = activeSubPlatform === 'all' || (t.sub_platform||'') === activeSubPlatform;
    const okQ    = !q || [t.title, t.platform, t.sub_platform, t.description, t.budget].join(' ').toLowerCase().includes(q);
    return okType && okP && okSub && okQ;
  });

  // ── Sort by date ──────────────────────────────
  rows.sort((a, b) => {
    const va = dateVal(a.date);
    const vb = dateVal(b.date);
    return sortDir === 'desc'
      ? vb.localeCompare(va)
      : va.localeCompare(vb);
  });

  document.getElementById('countNum').textContent = rows.length;
  const wrap = document.getElementById('tableWrap');

  if (!rows.length) {
    wrap.innerHTML = `<div class="empty"><div class="empty-icon">⊙</div>
      <h3>${allTenders.length ? 'Sin resultados para ese filtro' : 'Sin convocatorias esta semana'}</h3>
      <p>${allTenders.length ? 'Prueba otro filtro o término.' : 'El sistema actualiza automáticamente 3 veces al día.'}</p>
    </div>`;
    return;
  }

  const arrowClass = `th-sort ${sortDir}`;

  const trs = rows.map((t, i) => {
    const ct    = callType(t);
    const ctry  = country(t);
    const badge = BADGE[t.topic]  || 'b-other';
    const blbl  = BLABEL[t.topic] || 'OTRA';
    const hasBudget = t.budget && t.budget !== 'null' && t.budget !== 'Variable' && t.budget !== '—';
    const delay = Math.min(i * 18, 400);

    return `<tr style="animation:fadeUp .22s ease ${delay}ms both">
  <td>
    <div class="td-title">${esc(t.title)}<span class="topic-tag ${badge}">${blbl}</span></div>
    <div class="td-country">${ctry}</div>
    ${t.deadline ? `<div class="td-deadline">⏳ Cierre: ${fmtDate(t.deadline)}</div>` : ''}
  </td>
  <td class="td-date">${fmtDate(t.date)}</td>
  <td>
    <div class="td-entity">${esc(t.platform||'—')}</div>
    ${t.sub_platform ? `<div class="td-subplatform">${esc(t.sub_platform)}</div>` : ''}
    <span class="type-pill ${ct.c}">${ct.l}</span>
  </td>
  <td>${hasBudget
    ? `<span class="td-budget">${esc(t.budget)}</span>`
    : `<span class="td-budget empty">—</span>`}</td>
  <td class="td-link">${t.url
    ? `<a class="link-btn" href="${esc(t.url)}" target="_blank" rel="noopener">Ver <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>`
    : '<span style="color:var(--muted2);font-size:11px">—</span>'}</td>
</tr>`;
  }).join('');

  wrap.innerHTML = `<div class="tbl-wrap"><table>
  <colgroup>
    <col style="width:32%"/><col style="width:10%"/>
    <col style="width:22%"/><col style="width:14%"/><col style="width:8%"/>
  </colgroup>
  <thead><tr>
    <th>CONVOCATORIA · PAÍS / UE</th>
    <th>
      <span class="${arrowClass}" id="sortBtn" title="Ordenar por fecha">
        FECHA DE PUBLICACIÓN <span class="arrow"></span>
      </span>
    </th>
    <th>ENTIDAD Y TIPO DE CONVOCATORIA</th>
    <th>VALOR / FINANCIACIÓN</th>
    <th style="text-align:center">ENLACE</th>
  </tr></thead>
  <tbody>${trs}</tbody>
</table></div>`;

  // Bind sort click (must re-bind after each render)
  document.getElementById('sortBtn').addEventListener('click', () => {
    sortDir = sortDir === 'desc' ? 'asc' : 'desc';
    render();
  });
}

function showEmpty(h, p) {
  document.getElementById('countNum').textContent = '0';
  document.getElementById('tableWrap').innerHTML =
    `<div class="empty"><div class="empty-icon">⊙</div><h3>${h}</h3><p>${p}</p></div>`;
}

/* ─── LAST UPDATED ──────────────────────────────
   manualFlag: si la fecha es de la última pulsación de Actualizar,
   mostramos también minutos exactos para que se vea "vivo".       */
function setUpdated(iso, manualFlag) {
  const el = document.getElementById('lastUpdate');
  if (!iso) { el.textContent = 'Sin datos'; return; }
  try {
    const d = new Date(iso);
    const txt = d.toLocaleString('es-ES',
      {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
    el.textContent = (manualFlag ? 'Actualizado: ' : 'Última búsqueda: ') + txt;
  } catch { el.textContent = 'Actualizado'; }
}

/* ─── COUNTDOWN ───────────────────────────────── */
function startCountdown() {
  function tick() {
    const now  = new Date();
    const next = new Date(now);
    next.setDate(now.getDate() + ((7 - now.getDay()) % 7 || 7));
    next.setHours(0, 0, 0, 0);
    const diff = next - now;
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000)  / 60000);
    const s = Math.floor((diff % 60000)    / 1000);
    document.getElementById('countdown').textContent =
      `· Reinicio semanal en ${d}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
  }
  tick(); setInterval(tick, 1000);
}

/* ─── EVENTS ──────────────────────────────────── */
document.getElementById('btnRefresh').addEventListener('click', () => loadData(true));

document.getElementById('types').addEventListener('click', e => {
  const b = e.target.closest('.tbtn'); if (!b) return;
  document.querySelectorAll('.tbtn').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); activeType = b.dataset.c; render();
});

document.getElementById('platforms').addEventListener('click', e => {
  const b = e.target.closest('.ptag'); if (!b) return;
  // Solo quitar 'on' de los pills del filtro principal (no del sub-filtro)
  document.querySelectorAll('#platforms .ptag').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  activePlatform = b.dataset.p;
  activeSubPlatform = 'all';   // resetear sub-filtro al cambiar plataforma
  rebuildSubPlatforms();
  render();
});

/* ─── SUB-PLATAFORMAS DINÁMICAS ───────────────
   Cuando se selecciona una plataforma con sub-programas
   (ej. F&T Portal o EIT UM), se muestran los disponibles
   detectados a partir de los datos cargados.            */
function rebuildSubPlatforms() {
  const wrap = document.getElementById('subPlatforms');
  const list = document.getElementById('subPlatformsList');

  if (activePlatform === 'all') {
    wrap.style.display = 'none';
    list.innerHTML = '';
    return;
  }

  // Recolectar sub_platforms únicos de la plataforma activa
  const subs = new Set();
  for (const t of allTenders) {
    if ((t.platform || '') === activePlatform && t.sub_platform) {
      subs.add(t.sub_platform);
    }
  }

  // Si solo hay 1 (o ninguno), no tiene sentido mostrar el sub-filtro
  if (subs.size <= 1) {
    wrap.style.display = 'none';
    list.innerHTML = '';
    return;
  }

  // Construir botones
  const buttons = ['<button class="ptag sub on" data-s="all">Todas</button>'];
  for (const s of [...subs].sort()) {
    buttons.push(`<button class="ptag sub" data-s="${esc(s)}">${esc(s)}</button>`);
  }
  list.innerHTML = buttons.join('');
  wrap.style.display = 'block';
}

document.getElementById('subPlatformsList').addEventListener('click', e => {
  const b = e.target.closest('.ptag'); if (!b) return;
  document.querySelectorAll('#subPlatformsList .ptag').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  activeSubPlatform = b.dataset.s;
  render();
});

document.getElementById('searchInput').addEventListener('input', render);

/* ─── INIT ────────────────────────────────────── */
loadData();
startCountdown();
setInterval(() => loadData(false), REFRESH_MS);
</script>
</body>
</html>
